services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: keitaro
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql
      - ./docker/create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app -d keitaro']
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
